name: ConectaBrasil migration checks

on:
  push:
    branches:
      - feature/migracao-final-br-py
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run automated tests
        run: npm test
      - name: Build application
        run: npm run build
